<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Alicia AI — World</title>

<style>

html, body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #15191c;

    touch-action: none;

    user-select: none;

    -webkit-user-select: none;
}


canvas {

    display: block;

    width: 100%;
    height: 100%;
}


/* =========================
   ДЖОЙСТИК
========================= */

#joystick {

    position: fixed;

    left: 35px;
    bottom: 45px;

    width: 120px;
    height: 120px;

    border-radius: 50%;

    background:
    rgba(255,255,255,0.10);

    border:
    2px solid rgba(255,255,255,0.20);

    box-sizing: border-box;

    z-index: 10;

    touch-action: none;
}


#stick {

    position: absolute;

    left: 35px;
    top: 35px;

    width: 50px;
    height: 50px;

    border-radius: 50%;

    background:
    rgba(255,255,255,0.35);

    border:
    2px solid rgba(255,255,255,0.45);

    box-sizing: border-box;
}


/* =========================
   ПОДСКАЗКА
========================= */

#hint {

    position: fixed;

    top: 20px;
    left: 50%;

    transform:
    translateX(-50%);

    padding:
    9px 15px;

    color: white;

    font-family:
    Arial, sans-serif;

    font-size: 13px;

    background:
    rgba(0,0,0,0.35);

    border-radius: 18px;

    z-index: 10;

    pointer-events: none;

    transition:
    opacity 1s;
}

</style>

</head>


<body>


<div id="hint">

Левая сторона — движение • Правая — обзор

</div>


<div id="joystick">

<div id="stick"></div>

</div>


<script type="module">


import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


// =====================================================
// СЦЕНА
// =====================================================

const scene =
new THREE.Scene();


scene.background =
new THREE.Color(
    0x20262b
);


// =====================================================
// РАЗМЕР МИРА
// =====================================================

const ROOM_WIDTH = 40;

const ROOM_DEPTH = 24;

const ROOM_HEIGHT = 6;

const WALL = 0.25;


// =====================================================
// КАМЕРА
// =====================================================

const camera =
new THREE.PerspectiveCamera(

    72,

    window.innerWidth /
    window.innerHeight,

    0.05,

    150
);


camera.position.set(

    0,

    2.0,

    7
);


// =====================================================
// РЕНДЕР
// =====================================================

const renderer =
new THREE.WebGLRenderer({

    antialias: true,

    powerPreference:
    "high-performance"
});


renderer.setSize(

    window.innerWidth,

    window.innerHeight
);


renderer.setPixelRatio(

    Math.min(
        window.devicePixelRatio,
        1.7
    )
);


renderer.shadowMap.enabled =
true;


renderer.shadowMap.type =
THREE.PCFSoftShadowMap;


document.body.appendChild(
    renderer.domElement
);


// =====================================================
// ПРОЦЕДУРНАЯ ТЕКСТУРА ДЕРЕВА
// =====================================================

function createWoodTexture() {

    const canvas =
    document.createElement(
        "canvas"
    );

    canvas.width = 512;

    canvas.height = 512;


    const ctx =
    canvas.getContext("2d");


    ctx.fillStyle =
    "#70462e";

    ctx.fillRect(
        0,
        0,
        512,
        512
    );


    // деревянные полосы

    for (
        let y = 0;
        y < 512;
        y += 32
    ) {

        ctx.fillStyle =
        y % 64 === 0
        ? "#815537"
        : "#674129";

        ctx.fillRect(
            0,
            y,
            512,
            28
        );
    }


    // волокна

    for (
        let i = 0;
        i < 120;
        i++
    ) {

        const y =
        Math.random() * 512;

        const x =
        Math.random() * 512;

        const length =
        20 +
        Math.random() * 100;


        ctx.strokeStyle =
        "rgba(45,25,15,0.25)";

        ctx.lineWidth =
        1 +
        Math.random() * 2;


        ctx.beginPath();

        ctx.moveTo(
            x,
            y
        );

        ctx.lineTo(
            x + length,
            y + (Math.random()-0.5)*8
        );

        ctx.stroke();
    }


    const texture =
    new THREE.CanvasTexture(
        canvas
    );


    texture.wrapS =
    THREE.RepeatWrapping;

    texture.wrapT =
    THREE.RepeatWrapping;


    texture.repeat.set(
        4,
        2
    );


    return texture;
}


// =====================================================
// ТЕКСТУРА ПОЛА
// =====================================================

function createFloorTexture() {

    const canvas =
    document.createElement(
        "canvas"
    );

    canvas.width = 512;

    canvas.height = 512;


    const ctx =
    canvas.getContext("2d");


    ctx.fillStyle =
    "#3b2920";

    ctx.fillRect(
        0,
        0,
        512,
        512
    );


    // доски

    for (
        let x = 0;
        x < 512;
        x += 64
    ) {

        ctx.fillStyle =
        x % 128 === 0
        ? "#493126"
        : "#34241d";


        ctx.fillRect(
            x,
            0,
            58,
            512
        );
    }


    // линии досок

    ctx.strokeStyle =
    "rgba(15,10,7,0.5)";

    ctx.lineWidth = 2;


    for (
        let x = 0;
        x < 512;
        x += 64
    ) {

        ctx.beginPath();

        ctx.moveTo(
            x,
            0
        );

        ctx.lineTo(
            x,
            512
        );

        ctx.stroke();
    }


    const texture =
    new THREE.CanvasTexture(
        canvas
    );


    texture.wrapS =
    THREE.RepeatWrapping;

    texture.wrapT =
    THREE.RepeatWrapping;


    texture.repeat.set(
        8,
        5
    );


    return texture;
}


// =====================================================
// МАТЕРИАЛЫ
// =====================================================

const woodTexture =
createWoodTexture();


const floorTexture =
createFloorTexture();


const wallMaterial =
new THREE.MeshStandardMaterial({

    map:
    woodTexture,

    roughness:
    0.85
});


const floorMaterial =
new THREE.MeshStandardMaterial({

    map:
    floorTexture,

    roughness:
    0.95
});


const darkWood =
new THREE.MeshStandardMaterial({

    color:
    0x40281d,

    roughness:
    0.9
});


const fabric =
new THREE.MeshStandardMaterial({

    color:
    0x57494a,

    roughness:
    1
});


// =====================================================
// ПОЛ
// =====================================================

const floor =
new THREE.Mesh(

    new THREE.BoxGeometry(

        ROOM_WIDTH,

        0.2,

        ROOM_DEPTH
    ),

    floorMaterial
);


floor.position.y =
-0.1;


floor.receiveShadow =
true;


scene.add(
    floor
);


// =====================================================
// ПОТОЛОК
// =====================================================

const ceiling =
new THREE.Mesh(

    new THREE.BoxGeometry(

        ROOM_WIDTH,

        0.2,

        ROOM_DEPTH
    ),

    darkWood
);


ceiling.position.y =
ROOM_HEIGHT;


scene.add(
    ceiling
);


// =====================================================
// СТЕНЫ
// =====================================================

function createWall(

    width,
    height,
    depth,
    x,
    y,
    z

) {

    const wall =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            width,
            height,
            depth
        ),

        wallMaterial
    );


    wall.position.set(
        x,
        y,
        z
    );


    wall.receiveShadow =
    true;


    scene.add(
        wall
    );


    return wall;
}


// задняя

createWall(

    ROOM_WIDTH,

    ROOM_HEIGHT,

    WALL,

    0,

    ROOM_HEIGHT / 2,

    -ROOM_DEPTH / 2
);


// передняя

createWall(

    ROOM_WIDTH,

    ROOM_HEIGHT,

    WALL,

    0,

    ROOM_HEIGHT / 2,

    ROOM_DEPTH / 2
);


// левая

createWall(

    WALL,

    ROOM_HEIGHT,

    ROOM_DEPTH,

    -ROOM_WIDTH / 2,

    ROOM_HEIGHT / 2,

    0
);


// правая

createWall(

    WALL,

    ROOM_HEIGHT,

    ROOM_DEPTH,

    ROOM_WIDTH / 2,

    ROOM_HEIGHT / 2,

    0
);


// =====================================================
// ОКНО
// =====================================================

const glass =
new THREE.MeshBasicMaterial({

    color:
    0x79b9d8,

    transparent:
    true,

    opacity:
    0.85
});


const windowObject =
new THREE.Mesh(

    new THREE.BoxGeometry(
        7,
        3.5,
        0.08
    ),

    glass
);


windowObject.position.set(

    -8,

    3.4,

    -11.8
);


scene.add(
    windowObject
);


// рама

function frame(

    width,
    height,
    x,
    y
) {

    const object =
    new THREE.Mesh(

        new THREE.BoxGeometry(

            width,

            height,

            0.18
        ),

        darkWood
    );


    object.position.set(

        x,

        y,

        -11.65
    );


    scene.add(
        object
    );
}


frame(
    7.4,
    0.2,
    -8,
    5.2
);


frame(
    7.4,
    0.2,
    -8,
    1.6
);


frame(
    0.2,
    3.6,
    -11.6,
    3.4
);


frame(
    0.2,
    3.6,
    -4.4,
    3.4
);


frame(
    0.15,
    3.5,
    -8,
    3.4
);


// =====================================================
// ФУНКЦИЯ КУБА
// =====================================================

function box(

    width,
    height,
    depth,
    x,
    y,
    z,
    material

) {

    const object =
    new THREE.Mesh(

        new THREE.BoxGeometry(

            width,
            height,
            depth
        ),

        material
    );


    object.position.set(
        x,
        y,
        z
    );


    object.castShadow =
    true;


    object.receiveShadow =
    true;


    scene.add(
        object
    );


    return object;
}


// =====================================================
// КРОВАТЬ
// =====================================================

box(

    4.5,
    0.5,
    7,

    -12,

    0.65,

    2,

    darkWood
);


box(

    4.2,
    0.45,
    6.7,

    -12,

    1.05,

    2,

    fabric
);


// изголовье

box(

    4.5,
    2.5,
    0.3,

    -12,

    1.7,

    -1.25,

    darkWood
);


// =====================================================
// СТОЛ
// =====================================================

box(

    5,
    0.3,
    2,

    7,
    1.4,
    -5,

    darkWood
);


for (
    const x of [5, 9]
) {

    for (
        const z of [-5.7, -4.3]
    ) {

        box(

            0.2,
            1.4,
            0.2,

            x,
            0.7,
            z,

            darkWood
        );
    }
}


// =====================================================
// КРЕСЛО
// =====================================================

box(

    2,
    0.3,
    2,

    7,
    0.9,
    -1,

    fabric
);


box(

    2,
    2.5,
    0.3,

    7,
    2.0,
    0,

    fabric
);


// =====================================================
// КУХОННАЯ ЗОНА
// =====================================================

box(

    7,
    1.2,
    1.2,

    12,
    0.6,
    -8,

    darkWood
);


box(

    7,
    0.25,
    1.3,

    12,
    1.3,
    -8,

    woodTexture ?
    wallMaterial :
    darkWood
);


// шкафы

for (
    let i = 0;
    i < 4;
    i++
) {

    box(

        1.5,
        2.2,
        0.7,

        9.5 + i * 1.7,

        2.5,
        -8,

        darkWood
    );
}


// =====================================================
// КОВЁР
// =====================================================

box(

    8,
    0.04,
    5,

    -1,
    0.03,
    3,

    new THREE.MeshStandardMaterial({

        color:
        0x55413b,

        roughness:
        1
    })
);


// =====================================================
// СВЕТ
// =====================================================

scene.add(

    new THREE.AmbientLight(

        0xffffff,

        0.55
    )
);


const mainLight =
new THREE.PointLight(

    0xffd8a5,

    40,

    25
);


mainLight.position.set(

    0,

    5.3,

    0
);


mainLight.castShadow =
true;


scene.add(
    mainLight
);


// свет окна

const windowLight =
new THREE.PointLight(

    0x9edcff,

    25,

    18
);


windowLight.position.set(

    -8,

    3,

    -8
);


scene.add(
    windowLight
);


// =====================================================
// УПРАВЛЕНИЕ
// =====================================================

let yaw = 0;

let pitch = 0;


let targetYaw = 0;

let targetPitch = 0;


// скорость

let velocityX = 0;

let velocityZ = 0;


const moveSpeed = 0.075;


// =====================================================
// ДЖОЙСТИК
// =====================================================

const joystick =
document.getElementById(
    "joystick"
);


const stick =
document.getElementById(
    "stick"
);


let joyX = 0;

let joyY = 0;

let joystickTouch = null;


joystick.addEventListener(

    "touchstart",

    (event) => {

        event.preventDefault();

        const touch =
        event.changedTouches[0];

        joystickTouch =
        touch.identifier;

        updateJoystick(
            touch
        );
    },

    { passive: false }
);


joystick.addEventListener(

    "touchmove",

    (event) => {

        event.preventDefault();


        for (
            const touch
            of event.changedTouches
        ) {

            if (
                touch.identifier ===
                joystickTouch
            ) {

                updateJoystick(
                    touch
                );
            }
        }

    },

    { passive: false }
);


joystick.addEventListener(

    "touchend",

    (event) => {

        for (
            const touch
            of event.changedTouches
        ) {

            if (
                touch.identifier ===
                joystickTouch
            ) {

                joyX = 0;

                joyY = 0;

                stick.style.transform =
                "translate(0px,0px)";

                joystickTouch =
                null;
            }
        }

    }
);


function updateJoystick(
    touch
) {

    const rect =
    joystick.getBoundingClientRect();


    let x =
    touch.clientX -
    (rect.left +
    rect.width / 2);


    let y =
    touch.clientY -
    (rect.top +
    rect.height / 2);


    const max =
    42;


    const distance =
    Math.sqrt(
        x*x + y*y
    );


    if (
        distance > max
    ) {

        x =
        x / distance *
        max;

        y =
        y / distance *
        max;
    }


    joyX =
    x / max;

    joyY =
    y / max;


    stick.style.transform =
    `translate(${x}px, ${y}px)`;
}


// =====================================================
// ОБЗОР КАМЕРЫ
// =====================================================

let lookTouch = null;

let lastLookX = 0;

let lastLookY = 0;


renderer.domElement.addEventListener(

    "touchstart",

    (event) => {

        if (
            event.touches.length !== 1
        )
            return;


        const touch =
        event.touches[0];


        // левая часть экрана
        // принадлежит джойстику

        if (
            touch.clientX <
            window.innerWidth * 0.35
        )
            return;


        lookTouch =
        touch.identifier;


        lastLookX =
        touch.clientX;

        lastLookY =
        touch.clientY;

    },

    { passive: false }
);


renderer.domElement.addEventListener(

    "touchmove",

    (event) => {

        if (
            event.touches.length !== 1
        )
            return;


        for (
            const touch
            of event.changedTouches
        ) {

            if (
                touch.identifier ===
                lookTouch
            ) {

                const dx =
                touch.clientX -
                lastLookX;


                const dy =
                touch.clientY -
                lastLookY;


                targetYaw -=
                dx * 0.004;


                targetPitch -=
                dy * 0.003;


                targetPitch =
                Math.max(

                    -1.15,

                    Math.min(
                        1.15,
                        targetPitch
                    )
                );


                lastLookX =
                touch.clientX;


                lastLookY =
                touch.clientY;
            }
        }

    },

    { passive: false }
);


renderer.domElement.addEventListener(

    "touchend",

    (event) => {

        for (
            const touch
            of event.changedTouches
        ) {

            if (
                touch.identifier ===
                lookTouch
            ) {

                lookTouch =
                null;
            }
        }
    }
);


// =====================================================
// ДВИЖЕНИЕ
// =====================================================

function updateMovement() {


    // направление взгляда

    const forwardX =
    Math.sin(yaw);


    const forwardZ =
    -Math.cos(yaw);


    const rightX =
    Math.cos(yaw);


    const rightZ =
    Math.sin(yaw);


    // желаемое движение

    const desiredX =

    (
        forwardX *
        (-joyY)

    ) +

    (
        rightX *
        joyX
    );


    const desiredZ =

    (
        forwardZ *
        (-joyY)

    ) +

    (
        rightZ *
        joyX
    );


    velocityX +=
    (
        desiredX *
        moveSpeed -
        velocityX
    ) * 0.18;


    velocityZ +=
    (
        desiredZ *
        moveSpeed -
        velocityZ
    ) * 0.18;


    camera.position.x +=
    velocityX;


    camera.position.z +=
    velocityZ;


    // границы комнаты

    const margin = 0.8;


    camera.position.x =
    Math.max(

        -ROOM_WIDTH / 2 +
        margin,

        Math.min(

            ROOM_WIDTH / 2 -
            margin,

            camera.position.x
        )
    );


    camera.position.z =
    Math.max(

        -ROOM_DEPTH / 2 +
        margin,

        Math.min(

            ROOM_DEPTH / 2 -
            margin,

            camera.position.z
        )
    );
}


// =====================================================
// КАМЕРА
// =====================================================

let time = 0;


function updateCamera() {

    time += 0.016;


    yaw +=
    (
        targetYaw -
        yaw
    ) * 0.12;


    pitch +=
    (
        targetPitch -
        pitch
    ) * 0.12;


    const moving =
    Math.abs(velocityX) +
    Math.abs(velocityZ) >
    0.005;


    // покачивание при ходьбе

    let bob = 0;


    if (moving) {

        bob =
        Math.sin(
            time * 8
        ) * 0.025;
    }


    camera.position.y =

    2.05 +

    bob;


    const lookX =
    Math.sin(yaw) *
    Math.cos(pitch);


    const lookY =
    Math.sin(pitch);


    const lookZ =
    -Math.cos(yaw) *
    Math.cos(pitch);


    const distance =
    10;


    const target =
    new THREE.Vector3(

        camera.position.x +
        lookX * distance,

        camera.position.y +
        lookY * distance,

        camera.position.z +
        lookZ * distance
    );


    camera.lookAt(
        target
    );
}


// =====================================================
// АНИМАЦИЯ
// =====================================================

function animate() {

    requestAnimationFrame(
        animate
    );


    updateMovement();

    updateCamera();


    renderer.render(
        scene,
        camera
    );
}


animate();


// =====================================================
// RESIZE
// =====================================================

window.addEventListener(

    "resize",

    () => {

        camera.aspect =
        window.innerWidth /
        window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,

            window.innerHeight
        );

    }
);


</script>

</body>

</html>
