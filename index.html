<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="
            width=device-width,
            initial-scale=1.0,
            maximum-scale=1.0,
            user-scalable=no
        "
    >

    <title>Alicia AI — Room</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #111;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;
        }

        canvas {
            display: block;

            width: 100%;
            height: 100%;

            outline: none;
        }

        #ui {
            position: fixed;

            left: 50%;
            bottom: 18px;

            transform: translateX(-50%);

            padding: 10px 16px;

            color: white;

            background:
                rgba(20, 20, 20, 0.48);

            border:
                1px solid
                rgba(255, 255, 255, 0.12);

            border-radius: 14px;

            backdrop-filter: blur(10px);

            font-size: 13px;

            pointer-events: none;
            user-select: none;

            z-index: 10;
        }

        #crosshair {
            position: fixed;

            left: 50%;
            top: 50%;

            width: 5px;
            height: 5px;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            background:
                rgba(255, 255, 255, 0.86);

            box-shadow:
                0 0 5px
                rgba(0, 0, 0, 0.4);

            pointer-events: none;

            z-index: 10;
        }
    </style>
</head>

<body>

<div id="crosshair"></div>

<div id="ui">
    🦊 Клик — осмотр · WASD — движение · Esc — курсор
</div>

<script
    type="module"
    src="./js/main.js">
</script>

</body>
</html>
