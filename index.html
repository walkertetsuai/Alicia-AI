function makeWood(){

    const c =
    document.createElement("canvas");

    c.width=1024;
    c.height=1024;

    const ctx =
    c.getContext("2d");

    ctx.fillStyle="#765238";

    ctx.fillRect(
        0,0,1024,1024
    );


    // planks

    for(
        let y=0;
        y<1024;
        y+=80
    ){

        const variation =
        Math.random()*25;

        ctx.fillStyle=
        `rgb(
            ${105+variation},
            ${69+variation*.6},
            ${42+variation*.4}
        )`;

        ctx.fillRect(
            0,
            y,
            1024,
            74
        );

        ctx.strokeStyle=
        "rgba(30,15,8,.55)";

        ctx.lineWidth=3;

        ctx.beginPath();

        ctx.moveTo(
            0,
            y+75
        );

        ctx.lineTo(
            1024,
            y+75
        );

        ctx.stroke();
    }


    // grain

    for(
        let i=0;
        i<900;
        i++
    ){

        const x=
        Math.random()*1024;

        const y=
        Math.random()*1024;

        const length=
        30+Math.random()*180;

        ctx.strokeStyle=
        "rgba(35,18,9,.20)";

        ctx.lineWidth=
        .5+Math.random()*2;

        ctx.beginPath();

        ctx.moveTo(
            x,
            y
        );

        ctx.bezierCurveTo(

            x+length*.25,
            y-4,

            x+length*.7,
            y+5,

            x+length,
            y
        );

        ctx.stroke();
    }


    const texture =
    new THREE.CanvasTexture(c);

    texture.wrapS=
    THREE.RepeatWrapping;

    texture.wrapT=
    THREE.RepeatWrapping;

    texture.repeat.set(
        4,
        3
    );

    texture.anisotropy =
    renderer.capabilities
    .getMaxAnisotropy();

    return texture;
}


// ============================================================
// FLOOR TEXTURE
// ============================================================

function makeFloor(){

    const c =
    document.createElement("canvas");

    c.width=1024;
    c.height=1024;

    const ctx =
    c.getContext("2d");

    ctx.fillStyle="#3c2920";

    ctx.fillRect(
        0,0,1024,1024
    );


    for(
        let x=0;
        x<1024;
        x+=92
    ){

        const v=
        Math.random()*20;

        ctx.fillStyle=
        `rgb(
            ${55+v},
            ${38+v*.6},
            ${29+v*.4}
        )`;

        ctx.fillRect(
            x,
            0,
            86,
            1024
        );
    }


    for(
        let x=0;
        x<1024;
        x+=92
    ){

        ctx.strokeStyle=
        "rgba(15,8,5,.55)";

        ctx.lineWidth=3;

        ctx.beginPath();

        ctx.moveTo(
            x,
            0
        );

        ctx.lineTo(
            x,
            1024
        );

        ctx.stroke();
    }


    // small imperfections

    for(
        let i=0;
        i<500;
        i++
    ){

        ctx.fillStyle=
        "rgba(15,8,5,.15)";

        ctx.fillRect(

            Math.random()*1024,
            Math.random()*1024,

            Math.random()*8+1,
            Math.random()*2+1
        );
    }


    const texture =
    new THREE.CanvasTexture(c);

    texture.wrapS=
    THREE.RepeatWrapping;

    texture.wrapT=
    THREE.RepeatWrapping;

    texture.repeat.set(
        8,
        6
    );

    texture.anisotropy =
    renderer.capabilities
    .getMaxAnisotropy();

    return texture;
}

let yaw=0;
let pitch=0;

let targetYaw=0;
let targetPitch=0;

let velocityX=0;
let velocityZ=0;

const acceleration=.015;

const friction=.84;

const maxSpeed=.11;


// ============================================================
// JOYSTICK
// ============================================================

const joystick =
document.getElementById(
    "joystick"
);

const stick =
document.getElementById(
    "stick"
);

let joyX=0;
let joyY=0;

let joyID=null;


function moveJoystick(t){

    const r =
    joystick.getBoundingClientRect();

    let x =
    t.clientX -
    (
        r.left+r.width/2
    );

    let y =
    t.clientY -
    (
        r.top+r.height/2
    );

    const max=43;

    const len =
    Math.sqrt(
        x*x+y*y
    );

    if(len>max){

        x=x/len*max;
        y=y/len*max;
    }

    joyX=x/max;
    joyY=y/max;

    stick.style.transform=
    `translate(${x}px,${y}px)`;
}


joystick.addEventListener(
    "touchstart",
    e=>{

        e.preventDefault();

        const t=
        e.changedTouches[0];

        joyID=t.identifier;

        moveJoystick(t);
    },
    {passive:false}
);


joystick.addEventListener(
    "touchmove",
    e=>{

        e.preventDefault();

        for(
            const t
            of e.changedTouches
        ){

            if(
                t.identifier===
                joyID
            ){

                moveJoystick(t);
            }
        }
    },
    {passive:false}
);


joystick.addEventListener(
    "touchend",
    e=>{

        for(
            const t
            of e.changedTouches
        ){

            if(
                t.identifier===
                joyID
            ){

                joyID=null;

                joyX=0;
                joyY=0;

                stick.style.transform=
                "translate(0,0)";
            }
        }
    }
);


// ============================================================
// LOOK
// ============================================================

let lookID=null;

let lastLookX=0;
let lastLookY=0;


renderer.domElement.addEventListener(
    "touchstart",
    e=>{

        if(
            e.touches.length!==1
        )
        return;

        const t=e.touches[0];

        if(
            t.clientX<
            window.innerWidth*.35
        )
        return;

        lookID=t.identifier;

        lastLookX=t.clientX;
        lastLookY=t.clientY;
    }
);


renderer.domElement.addEventListener(
    "touchmove",
    e=>{

        if(
            e.touches.length!==1
        )
        return;

        for(
            const t
            of e.changedTouches
        ){

            if(
                t.identifier===
                lookID
            ){

                const dx=
                t.clientX-lastLookX;

                const dy=
                t.clientY-lastLookY;

                targetYaw -=
                dx*.0032;

                targetPitch -=
                dy*.0025;

                targetPitch=
                THREE.MathUtils.clamp(
                    targetPitch,
                    -1.1,
                    1.1
                );

                lastLookX=
                t.clientX;

                lastLookY=
                t.clientY;
            }
        }
    }
);


renderer.domElement.addEventListener(
    "touchend",
    e=>{

        for(
            const t
            of e.changedTouches
        ){

            if(
                t.identifier===
                lookID
            ){

                lookID=null;
            }
        }
    }
);


// ============================================================
// MOVEMENT
// ============================================================

function movement(){

    const forwardX=
    Math.sin(yaw);

    const forwardZ=
    -Math.cos(yaw);

    const rightX=
    Math.cos(yaw);

    const rightZ=
    Math.sin(yaw);


    const wantedX=
    forwardX*(-joyY)
    +
    rightX*joyX;


    const wantedZ=
    forwardZ*(-joyY)
    +
    rightZ*joyX;


    velocityX +=
    wantedX*
    acceleration;

    velocityZ +=
    wantedZ*
    acceleration;


    velocityX*=friction;
    velocityZ*=friction;


    const speed=
    Math.sqrt(
        velocityX*
        velocityX+
        velocityZ*
        velocityZ
    );


    if(
        speed>maxSpeed
    ){

        velocityX=
        velocityX/
        speed*
        maxSpeed;

        velocityZ=
        velocityZ/
        speed*
        maxSpeed;
    }


    camera.position.x +=
    velocityX;

    camera.position.z +=
    velocityZ;


    // house boundaries

    const margin=1;


    camera.position.x=
    THREE.MathUtils.clamp(

        camera.position.x,

        -HOUSE_W/2+margin,

        HOUSE_W/2-margin
    );


    camera.position.z=
    THREE.MathUtils.clamp(

        camera.position.z,

        -HOUSE_D/2+margin,

        HOUSE_D/2-margin
    );
}


// ============================================================
// CAMERA
// ============================================================

let time=0;


function updateCamera(){

    time+=.016;


    yaw +=
    (
        targetYaw-yaw
    )*.095;


    pitch +=
    (
        targetPitch-pitch
    )*.095;


    const speed=
    Math.sqrt(
        velocityX*
        velocityX+
        velocityZ*
        velocityZ
    );


    const walking=
    speed>.008;


    let bob=0;


    if(walking){

        bob=
        Math.sin(time*9)*
        .026*
        Math.min(
            speed/maxSpeed,
            1
        );
    }


    camera.position.y=
    2.05+bob;


    const lx=
    Math.sin(yaw)*
    Math.cos(pitch);


    const ly=
    Math.sin(pitch);


    const lz=
    -Math.cos(yaw)*
    Math.cos(pitch);


    const target=
    new THREE.Vector3(

        camera.position.x+
        lx*10,

        camera.position.y+
        ly*10,

        camera.position.z+
        lz*10
    );


    camera.lookAt(target);
}


// ============================================================
// FIRE ANIMATION
// ============================================================

function animateFire(){

    fire.intensity=
    24+
    Math.sin(
        time*11
    )*5+
    Math.sin(
        time*17
    )*3;
}


// ============================================================
// LOOP
// ============================================================

function animate(){

    requestAnimationFrame(
        animate
    );


    movement();

    updateCamera();

    animateFire();


    renderer.render(
        scene,
        camera
    );
}


animate();


// ============================================================
// ORIENTATION / RESIZE
// ============================================================

function resize(){

    camera.aspect=
    window.innerWidth/
    window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
}


window.addEventListener(
    "resize",
    resize
);


window.addEventListener(
    "orientationchange",
    ()=>{

        setTimeout(
            resize,
            150
        );
    }
);

</script>
