function createWoodTexture() {

    const canvas =
    document.createElement("canvas");

    canvas.width = 512;
    canvas.height = 512;

    const ctx =
    canvas.getContext("2d");

    ctx.fillStyle =
    "#70452d";

    ctx.fillRect(
        0,
        0,
        512,
        512
    );


    // Деревянные доски

    for (
        let y = 0;
        y < 512;
        y += 64
    ) {

        ctx.fillStyle =
        "#805438";

        ctx.fillRect(
            0,
            y,
            512,
            60
        );


        ctx.strokeStyle =
        "rgba(40,20,10,0.35)";

        ctx.lineWidth = 3;

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            512,
            y
        );

        ctx.stroke();


        // Волокна

        for (
            let i = 0;
            i < 12;
            i++
        ) {

            const startX =
            Math.random() * 512;

            ctx.strokeStyle =
            "rgba(45,25,12,0.20)";

            ctx.lineWidth = 1;

            ctx.beginPath();

            ctx.moveTo(
                startX,
                y + 10
            );

            ctx.bezierCurveTo(
                startX + 40,
                y + 20,
                startX - 30,
                y + 40,
                startX + 80,
                y + 55
            );

            ctx.stroke();
        }
    }


    const texture =
    new THREE.CanvasTexture(
        canvas
    );

    texture.wrapS =
    THREE.RepeatWrapping;

    texture.wrapT =
    THREE.RepeatWrapping;

    texture.repeat.set(
        3,
        3
    );

    return texture;
}


// =====================================================

function createFloorTexture() {

    const canvas =
    document.createElement("canvas");

    canvas.width = 512;
    canvas.height = 512;

    const ctx =
    canvas.getContext("2d");

    ctx.fillStyle =
    "#4a3023";

    ctx.fillRect(
        0,
        0,
        512,
        512
    );


    for (
        let x = 0;
        x < 512;
        x += 64
    ) {

        ctx.fillStyle =
        "#56392a";

        ctx.fillRect(
            x,
            0,
            58,
            512
        );


        ctx.strokeStyle =
        "rgba(25,15,10,0.35)";

        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.moveTo(
            x,
            0
        );

        ctx.lineTo(
            x,
            512
        );

        ctx.stroke();


        for (
            let i = 0;
            i < 8;
            i++
        ) {

            ctx.strokeStyle =
            "rgba(20,10,5,0.15)";

            ctx.beginPath();

            const y =
            Math.random() * 512;

            ctx.moveTo(
                x + 5,
                y
            );

            ctx.lineTo(
                x + 55,
                y + 3
            );

            ctx.stroke();
        }
    }


    const texture =
    new THREE.CanvasTexture(
        canvas
    );

    texture.wrapS =
    THREE.RepeatWrapping;

    texture.wrapT =
    THREE.RepeatWrapping;

    texture.repeat.set(
        5,
        3
    );

    return texture;
}

);

);


let joystickActive =
false;

let joystickX = 0;

let joystickY = 0;


joystick.addEventListener(
    "touchstart",
    event => {

        event.preventDefault();

        joystickActive =
        true;

        updateJoystick(
            event.touches[0]
        );

    },
    { passive: false }
);


joystick.addEventListener(
    "touchmove",
    event => {

        event.preventDefault();

        if (
            joystickActive
        ) {

            updateJoystick(
                event.touches[0]
            );
        }

    },
    { passive: false }
);


joystick.addEventListener(
    "touchend",
    event => {

        event.preventDefault();

        joystickActive =
        false;

        joystickX = 0;
        joystickY = 0;

        stick.style.transform =
        "translate(0px, 0px)";

    },
    { passive: false }
);


function updateJoystick(
    touch
) {

    const rect =
    joystick.getBoundingClientRect();

    const centerX =
    rect.left +
    rect.width / 2;

    const centerY =
    rect.top +
    rect.height / 2;


    let dx =
    touch.clientX -
    centerX;

    let dy =
    touch.clientY -
    centerY;


    const max =
    42;


    const distance =
    Math.sqrt(
        dx * dx +
        dy * dy
    );


    if (
        distance > max
    ) {

        dx =
        dx / distance *
        max;

        dy =
        dy / distance *
        max;
    }


    joystickX =
    dx / max;

    joystickY =
    dy / max;


    stick.style.transform =
    `translate(${dx}px, ${dy}px)`;
}


// =====================================================
// УПРАВЛЕНИЕ ВЗГЛЯДОМ
// =====================================================

let looking = false;

let lastLookX = 0;

let lastLookY = 0;


renderer.domElement.addEventListener(
    "touchstart",
    event => {

        if (
            event.touches.length !== 1
        )
            return;


        const touch =
        event.touches[0];


        // Правая половина
        // экрана = обзор

        if (
            touch.clientX >
            window.innerWidth / 2
        ) {

            looking = true;

            lastLookX =
            touch.clientX;

            lastLookY =
            touch.clientY;
        }

    }
);


renderer.domElement.addEventListener(
    "touchmove",
    event => {

        if (
            !looking ||
            event.touches.length !== 1
        )
            return;


        const touch =
        event.touches[0];


        const dx =
        touch.clientX -
        lastLookX;


        const dy =
        touch.clientY -
        lastLookY;


        targetYaw -=
        dx * 0.004;


        targetPitch -=
        dy * 0.003;


        targetPitch =
        Math.max(
            -1.2,
            Math.min(
                1.2,
                targetPitch
            )
        );


        lastLookX =
        touch.clientX;

        lastLookY =
        touch.clientY;
    }
);


renderer.domElement.addEventListener(
    "touchend",
    () => {

        looking = false;

    }
);

let mouseY = 0;


renderer.domElement.addEventListener(

    event => {

        mouseDown = true;

        mouseX =
        event.clientX;

        mouseY =

    }
);

    "mouseup",
    () => {

        mouseDown = false;

    }
);


window.addEventListener(
    "mousemove",
    event => {

        if (!mouseDown)
            return;


        const dx =
        event.clientX -
        mouseX;

        const dy =
        event.clientY -
        mouseY;


        targetYaw -=
        dx * 0.004;


        targetPitch -=
        dy * 0.003;


        targetPitch =
        Math.max(
            -1.2,
            Math.min(
                1.2,
                targetPitch
            )
        );


        mouseX =
        event.clientX;

        mouseY =
        event.clientY;

    }
);


// =====================================================
// ДВИЖЕНИЕ
// =====================================================

function movePlayer() {

    let forward = 0;

    let strafe = 0;


    // Джойстик

    forward -=
    joystickY;

    strafe +=
    joystickX;


    // WASD

    if (keys["w"])
        forward += 1;

    if (keys["s"])
        forward -= 1;

    if (keys["a"])
        strafe -= 1;

    if (keys["d"])
        strafe += 1;


    if (
        forward === 0 &&
        strafe === 0
    ) {

        return false;

    }


    const length =
    Math.sqrt(
        forward * forward +
        strafe * strafe
    );


    forward /= length;

    strafe /= length;


    const direction =
    new THREE.Vector3(
        Math.sin(yaw),
        0,
        -Math.cos(yaw)
    );


    const right =
    new THREE.Vector3(
        Math.cos(yaw),
        0,
        Math.sin(yaw)
    );


    const movement =
    new THREE.Vector3();


    movement.addScaledVector(
        direction,
        forward * WALK_SPEED
    );


    movement.addScaledVector(
        right,
        strafe * WALK_SPEED
    );


    const newX =
    player.x +
    movement.x;


    const newZ =
    player.z +
    movement.z;


    // Ограничение стенами

    const limitX =
    ROOM_WIDTH / 2 - 0.7;


    const limitZ =
    ROOM_DEPTH / 2 - 0.7;


    player.x =
    THREE.MathUtils.clamp(
        newX,
        -limitX,
        limitX
    );


    player.z =
    THREE.MathUtils.clamp(
        newZ,
        -limitZ,
        limitZ
    );


    return true;
}


// =====================================================
// КАМЕРА
// =====================================================

let walkTime = 0;


function updateCamera(
    moving
) {

    yaw +=
    (targetYaw - yaw) *
    0.12;


    pitch +=
    (targetPitch - pitch) *
    0.12;


    if (moving) {

        walkTime += 0.13;

    }


    const bob =
    moving
    ? Math.sin(
        walkTime
      ) * 0.025
    : 0;


    const sway =
    moving
    ? Math.sin(
        walkTime * 0.5
      ) * 0.012
    : 0;


    camera.position.x =
    player.x +
    sway;


    camera.position.y =
    player.y +
    bob;


    camera.position.z =
    player.z;


    const lookDirection =
    new THREE.Vector3(
        Math.sin(yaw) *
        Math.cos(pitch),

        Math.sin(pitch),

        -Math.cos(yaw) *
        Math.cos(pitch)
    );


    const target =
    new THREE.Vector3();

    target.copy(
        camera.position
    );

    target.add(
        lookDirection
    );


    camera.lookAt(
        target
    );
}


// =====================================================
// ЦИКЛ
// =====================================================

function animate() {

    requestAnimationFrame(
        animate
    );


    const moving =
    movePlayer();


    updateCamera(
        moving
    );


    renderer.render(
        scene,
        camera
    );

}


animate();


// =====================================================
// RESIZE
// =====================================================

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
        window.innerWidth /
        window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


// =====================================================
// УБИРАЕМ ПОДСКАЗКУ
// =====================================================

setTimeout(
    () => {

        document.getElementById(
            "hint"
        ).style.opacity = "0";

    },
    5000
);

</script>

</body>

</html>
