function woodTexture() {

    const c =
    document.createElement(
        "canvas"
    );

    c.width = 512;

    c.height = 512;


    const ctx =
    c.getContext("2d");


    ctx.fillStyle =
    "#765038";

    ctx.fillRect(
        0,
        0,
        512,
        512
    );


    for (
        let y = 0;
        y < 512;
        y += 38
    ) {

        ctx.fillStyle =
        y % 76 === 0
        ? "#835b3f"
        : "#69452f";


        ctx.fillRect(
            0,
            y,
            512,
            34
        );
    }


    for (
        let i = 0;
        i < 180;
        i++
    ) {

        const y =
        Math.random() * 512;

        const x =
        Math.random() * 512;

        ctx.strokeStyle =
        "rgba(45,25,15,0.22)";

        ctx.lineWidth =
        Math.random() * 2 + 0.5;


        ctx.beginPath();

        ctx.moveTo(
            x,
            y
        );

        ctx.lineTo(

            x +
            Math.random() * 100,

            y +
            (Math.random() - 0.5) * 10
        );

        ctx.stroke();
    }


    const texture =
    new THREE.CanvasTexture(c);


    texture.wrapS =
    THREE.RepeatWrapping;

    texture.wrapT =
    THREE.RepeatWrapping;


    texture.repeat.set(
        5,
        3
    );


    return texture;
}

function floorTexture() {

    const c =
    document.createElement(
        "canvas"
    );

    c.width = 512;

    c.height = 512;


    const ctx =
    c.getContext("2d");


    ctx.fillStyle =
    "#3b2920";

    ctx.fillRect(
        0,
        0,
        512,
        512
    );


    for (
        let x = 0;
        x < 512;
        x += 64
    ) {

        ctx.fillStyle =
        x % 128 === 0
        ? "#493126"
        : "#34231c";


        ctx.fillRect(
            x,
            0,
            60,
            512
        );
    }


    ctx.strokeStyle =
    "rgba(10,7,5,0.45)";


    ctx.lineWidth = 2;


    for (
        let x = 0;
        x < 512;
        x += 64
    ) {

        ctx.beginPath();

        ctx.moveTo(
            x,
            0
        );

        ctx.lineTo(
            x,
            512
        );

        ctx.stroke();
    }


    const texture =
    new THREE.CanvasTexture(c);


    texture.wrapS =
    THREE.RepeatWrapping;

    texture.wrapT =
    THREE.RepeatWrapping;


    texture.repeat.set(
        8,
        6
    );


    return texture;
}

);

    "stick"
);


let joyX = 0;

let joyY = 0;

let joystickID = null;


function joystickMove(
    touch
) {

    const rect =
    joystick.getBoundingClientRect();


    let x =
    touch.clientX -
    (
        rect.left +
        rect.width / 2
    );


    let y =
    touch.clientY -
    (
        rect.top +
        rect.height / 2
    );


    const max =
    43;


    const length =
    Math.sqrt(
        x*x + y*y
    );


    if (
        length > max
    ) {

        x =
        x / length *
        max;

        y =
        y / length *
        max;
    }


    joyX =
    x / max;

    joyY =
    y / max;


    stick.style.transform =
    `translate(${x}px,${y}px)`;
}


joystick.addEventListener(
    "touchstart",
    e => {

        e.preventDefault();

        const t =
        e.changedTouches[0];

        joystickID =
        t.identifier;

        joystickMove(t);
    },
    {passive:false}
);


joystick.addEventListener(
    "touchmove",
    e => {

        e.preventDefault();

        for (
            const t
            of e.changedTouches
        ) {

            if (
                t.identifier ===
                joystickID
            ) {

                joystickMove(t);
            }
        }
    },
    {passive:false}
);


joystick.addEventListener(
    "touchend",
    e => {

        for (
            const t
            of e.changedTouches
        ) {

            if (
                t.identifier ===
                joystickID
            ) {

                joystickID =
                null;

                joyX = 0;

                joyY = 0;

                stick.style.transform =
                "translate(0,0)";
            }
        }
    }
);


// ============================================================
// ОБЗОР
// ============================================================

let lookID = null;

let lastX = 0;

let lastY = 0;


renderer.domElement.addEventListener(
    "touchstart",
    e => {

        if (
            e.touches.length !== 1
        )
            return;


        const t =
        e.touches[0];


        if (
            t.clientX <
            window.innerWidth * 0.38
        )
            return;


        lookID =
        t.identifier;


        lastX =
        t.clientX;

        lastY =
        t.clientY;
    }
);


renderer.domElement.addEventListener(
    "touchmove",
    e => {

        if (
            e.touches.length !== 1
        )
            return;


        for (
            const t
            of e.changedTouches
        ) {

            if (
                t.identifier !==
                lookID
            )
                continue;


            const dx =
            t.clientX -
            lastX;


            const dy =
            t.clientY -
            lastY;


            targetYaw -=
            dx * 0.003;


            targetPitch -=
            dy * 0.0025;


            targetPitch =
            Math.max(
                -1.1,
                Math.min(
                    1.1,
                    targetPitch
                )
            );


            lastX =
            t.clientX;


            lastY =
            t.clientY;
        }
    }
);


renderer.domElement.addEventListener(
    "touchend",
    e => {

        for (
            const t
            of e.changedTouches
        ) {

            if (
                t.identifier ===
                lookID
            ) {

                lookID =
                null;
            }
        }
    }
);


// ============================================================
// ДВИЖЕНИЕ

function movement() {

    const forwardX =
    Math.sin(yaw);


    const forwardZ =
    -Math.cos(yaw);


    const rightX =
    Math.cos(yaw);


    const rightZ =
    Math.sin(yaw);


    const wantedX =

    (
        forwardX *
        (-joyY)
    )
    +
    (
        rightX *
        joyX
    );


    const wantedZ =

    (
        forwardZ *
        (-joyY)
    )
    +
    (
        rightZ *
        joyX
    );


    velocityX +=
    (
        wantedX *
        acceleration
    );


    velocityZ +=
    (
        wantedZ *
        acceleration
    );


    velocityX *=
    friction;


    velocityZ *=
    friction;


    const speed =
    Math.sqrt(
        velocityX *
        velocityX +

        velocityZ *
        velocityZ
    );


    if (
        speed > maxSpeed
    ) {

        velocityX =
        velocityX /
        speed *
        maxSpeed;


        velocityZ =
        velocityZ /
        speed *
        maxSpeed;
    }


    camera.position.x +=
    velocityX;


    camera.position.z +=
    velocityZ;


    // границы

    const margin =
    1;


    camera.position.x =
    THREE.MathUtils.clamp(

        camera.position.x,

        -W/2 + margin,

        W/2 - margin
    );


    camera.position.z =
    THREE.MathUtils.clamp(

        camera.position.z,

        -D/2 + margin,

        D/2 - margin
    );
}

// КАМЕРА
// ============================================================

let time = 0;


function updateCamera() {

    time += 0.016;


    yaw +=
    (
        targetYaw -
        yaw
    ) * 0.10;


    pitch +=
    (
        targetPitch -
        pitch
    ) * 0.10;


    const speed =
    Math.sqrt(

        velocityX *
        velocityX +

        velocityZ *
        velocityZ
    );


    const walking =
    speed > 0.008;


    let bob = 0;


    if (
        walking
    ) {

        bob =
        Math.sin(
            time * 9
        ) *
        0.025 *
        Math.min(
            speed / maxSpeed,
            1
        );
    }


    camera.position.y =
    2.05 +
    bob;


    const lookX =
    Math.sin(yaw) *
    Math.cos(pitch);


    const lookY =
    Math.sin(pitch);


    const lookZ =
    -Math.cos(yaw) *
    Math.cos(pitch);


    const target =
    new THREE.Vector3(

        camera.position.x +
        lookX * 10,

        camera.position.y +
        lookY * 10,

        camera.position.z +
        lookZ * 10
    );


    camera.lookAt(
        target
    );
}


// ============================================================
// АНИМАЦИЯ
// ============================================================

function animate() {

    requestAnimationFrame(
        animate
    );


    movement();

    updateCamera();


    renderer.render(
        scene,
        camera
    );
}


animate();


// ============================================================
// RESIZE
// ============================================================

window.addEventListener(

    "resize",

    () => {

        camera.aspect =
        window.innerWidth /
        window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,

            window.innerHeight
        );
    }
);


</script>
