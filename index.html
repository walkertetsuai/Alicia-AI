<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <title>Alicia AI — Room</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #bdb2a7;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
            touch-action: none;
        }

        #loading {
            position: fixed;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #bdb2a7;
            color: #ffffff;

            font-size: 18px;
            letter-spacing: 0.2px;

            z-index: 100;

            transition:
                opacity 0.45s ease;
        }

        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #crosshair {
            position: fixed;

            left: 50%;
            top: 50%;

            width: 5px;
            height: 5px;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            background:
                rgba(255, 255, 255, 0.92);

            box-shadow:
                0 0 0 1px rgba(0, 0, 0, 0.25),
                0 0 8px rgba(0, 0, 0, 0.25);

            pointer-events: none;

            z-index: 20;
        }

        #interact {
            position: fixed;

            left: 50%;
            top: calc(50% + 35px);

            transform:
                translateX(-50%);

            padding: 7px 12px;

            color: white;

            background:
                rgba(0, 0, 0, 0.55);

            border:
                1px solid
                rgba(255, 255, 255, 0.1);

            border-radius: 9px;

            backdrop-filter:
                blur(8px);

            opacity: 0;

            transition:
                opacity 0.15s;

            pointer-events: none;

            font-size: 13px;

            z-index: 20;
        }

        #interact.visible {
            opacity: 1;
        }

        #hud {
            position: fixed;

            left: 50%;
            bottom:
                calc(
                    18px +
                    env(safe-area-inset-bottom)
                );

            transform:
                translateX(-50%);

            padding:
                9px 15px;

            color:
                rgba(255, 255, 255, 0.94);

            background:
                rgba(20, 20, 22, 0.48);

            border:
                1px solid
                rgba(255, 255, 255, 0.13);

            border-radius: 14px;

            backdrop-filter:
                blur(12px);

            -webkit-backdrop-filter:
                blur(12px);

            font-size: 13px;

            pointer-events: none;
            user-select: none;

            z-index: 20;
        }
    </style>
</head>

<body>

<div id="loading">
    🦊 Alicia Room
</div>

<div id="crosshair"></div>

<div id="interact">
    E — открыть дверь
</div>

<div id="hud">
    WASD — движение · мышь — обзор · E — взаимодействие · Esc — курсор
</div>

<script
    type="module"
    src="./js/main.js">
</script>

</body>
</html>
