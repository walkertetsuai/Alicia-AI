<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Alicia AI — Room</title>

<style>

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #20252a;
    touch-action: none;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

#hint {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);

    padding: 10px 16px;

    color: white;
    font-family: Arial, sans-serif;
    font-size: 14px;

    background: rgba(0,0,0,0.35);
    border-radius: 20px;

    pointer-events: none;

    opacity: 0.8;
}

</style>
</head>


<body>

<div id="hint">
Свайп — осмотр • Два пальца — приближение
</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


// =====================================================
// СЦЕНА
// =====================================================

const scene = new THREE.Scene();

scene.background =
new THREE.Color(0x20252a);


// =====================================================
// РАЗМЕРЫ КОМНАТЫ
// =====================================================

const ROOM_WIDTH = 20;
const ROOM_DEPTH = 12;
const ROOM_HEIGHT = 5;

const WALL = 0.2;


// =====================================================
// КАМЕРА
// =====================================================

const camera =
new THREE.PerspectiveCamera(
    70,
    window.innerWidth /
    window.innerHeight,
    0.1,
    100
);


// Позиция наблюдателя

camera.position.set(
    0,
    2.1,
    3
);


// =====================================================
// РЕНДЕР
// =====================================================

const renderer =
new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
THREE.PCFSoftShadowMap;

document.body.appendChild(
    renderer.domElement
);


// =====================================================
// ОСВЕЩЕНИЕ
// =====================================================

const ambient =
new THREE.AmbientLight(
    0xffffff,
    0.65
);

scene.add(ambient);


const ceilingLight =
new THREE.PointLight(
    0xffd7a5,
    35,
    18
);

ceilingLight.position.set(
    0,
    4.4,
    0
);

ceilingLight.castShadow = true;

scene.add(ceilingLight);


// Свет из окна

const windowLight =
new THREE.PointLight(
    0x9ed8ff,
    18,
    12
);

windowLight.position.set(
    -6,
    3,
    -5
);

scene.add(windowLight);


// =====================================================
// МАТЕРИАЛЫ
// =====================================================

const floorMaterial =
new THREE.MeshStandardMaterial({
    color: 0x3d2920,
    roughness: 0.8
});


const wallMaterial =
new THREE.MeshStandardMaterial({
    color: 0x70452c,
    roughness: 0.8
});


const ceilingMaterial =
new THREE.MeshStandardMaterial({
    color: 0x4d3427,
    roughness: 0.9
});


const woodMaterial =
new THREE.MeshStandardMaterial({
    color: 0x80502f,
    roughness: 0.75
});


// =====================================================
// ПОЛ
// =====================================================

const floor =
new THREE.Mesh(
    new THREE.BoxGeometry(
        ROOM_WIDTH,
        0.2,
        ROOM_DEPTH
    ),
    floorMaterial
);

floor.position.y = -0.1;

floor.receiveShadow = true;

scene.add(floor);


// =====================================================
// ПОТОЛОК
// =====================================================

const ceiling =
new THREE.Mesh(
    new THREE.BoxGeometry(
        ROOM_WIDTH,
        0.2,
        ROOM_DEPTH
    ),
    ceilingMaterial
);

ceiling.position.y =
ROOM_HEIGHT;

scene.add(ceiling);


// =====================================================
// ЗАДНЯЯ СТЕНА
// =====================================================

const backWall =
new THREE.Mesh(
    new THREE.BoxGeometry(
        ROOM_WIDTH,
        ROOM_HEIGHT,
        WALL
    ),
    wallMaterial
);

backWall.position.set(
    0,
    ROOM_HEIGHT / 2,
    -ROOM_DEPTH / 2
);

backWall.receiveShadow = true;

scene.add(backWall);


// =====================================================
// ПЕРЕДНЯЯ СТЕНА
// =====================================================

const frontWall =
new THREE.Mesh(
    new THREE.BoxGeometry(
        ROOM_WIDTH,
        ROOM_HEIGHT,
        WALL
    ),
    wallMaterial
);

frontWall.position.set(
    0,
    ROOM_HEIGHT / 2,
    ROOM_DEPTH / 2
);

scene.add(frontWall);


// =====================================================
// ЛЕВАЯ СТЕНА
// =====================================================

const leftWall =
new THREE.Mesh(
    new THREE.BoxGeometry(
        WALL,
        ROOM_HEIGHT,
        ROOM_DEPTH
    ),
    wallMaterial
);

leftWall.position.set(
    -ROOM_WIDTH / 2,
    ROOM_HEIGHT / 2,
    0
);

scene.add(leftWall);


// =====================================================
// ПРАВАЯ СТЕНА
// =====================================================

const rightWall =
new THREE.Mesh(
    new THREE.BoxGeometry(
        WALL,
        ROOM_HEIGHT,
        ROOM_DEPTH
    ),
    wallMaterial
);

rightWall.position.set(
    ROOM_WIDTH / 2,
    ROOM_HEIGHT / 2,
    0
);

scene.add(rightWall);


// =====================================================
// ОКНО
// =====================================================

const windowGlass =
new THREE.MeshStandardMaterial({
    color: 0x78b6d8,
    roughness: 0.2,
    metalness: 0.05
});


const windowFrame =
new THREE.MeshStandardMaterial({
    color: 0x40291f
});


const windowWidth = 4;
const windowHeight = 2.5;


// Стекло

const windowMesh =
new THREE.Mesh(
    new THREE.BoxGeometry(
        windowWidth,
        windowHeight,
        0.08
    ),
    windowGlass
);

windowMesh.position.set(
    -5,
    3,
    -5.85
);

scene.add(windowMesh);


// Рамки

function createFrame(
    width,
    height,
    x,
    y
) {

    const frame =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            width,
            height,
            0.15
        ),
        windowFrame
    );

    frame.position.set(
        x,
        y,
        -5.75
    );

    scene.add(frame);
}


// верх

createFrame(
    4.3,
    0.15,
    -5,
    4.3
);


// низ

createFrame(
    4.3,
    0.15,
    -5,
    1.7
);


// левая

createFrame(
    0.15,
    2.7,
    -7.1,
    3
);


// правая

createFrame(
    0.15,
    2.7,
    -2.9,
    3
);


// =====================================================
// СТОЛ
// =====================================================

const table =
new THREE.Mesh(
    new THREE.BoxGeometry(
        4,
        0.25,
        1.8
    ),
    woodMaterial
);

table.position.set(
    2,
    1.35,
    -3
);

table.castShadow = true;

scene.add(table);


// =====================================================
// НОЖКИ СТОЛА
// =====================================================

const legPositions = [
    [0.5, -3.6],
    [3.5, -3.6],
    [0.5, -2.4],
    [3.5, -2.4]
];


for (
    const position
    of legPositions
) {

    const leg =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            0.18,
            1.35,
            0.18
        ),
        woodMaterial
    );

    leg.position.set(
        position[0],
        0.675,
        position[1]
    );

    leg.castShadow = true;

    scene.add(leg);
}


// =====================================================
// КРЕСЛО
// =====================================================

const chairSeat =
new THREE.Mesh(
    new THREE.BoxGeometry(
        1.5,
        0.25,
        1.5
    ),
    woodMaterial
);

chairSeat.position.set(
    2,
    0.8,
    0
);

chairSeat.castShadow = true;

scene.add(chairSeat);


const chairBack =
new THREE.Mesh(
    new THREE.BoxGeometry(
        1.5,
        2,
        0.2
    ),
    woodMaterial
);

chairBack.position.set(
    2,
    1.7,
    0.65
);

chairBack.castShadow = true;

scene.add(chairBack);


// =====================================================
// КОВЁР
// =====================================================

const carpet =
new THREE.Mesh(
    new THREE.BoxGeometry(
        6,
        0.03,
        4
    ),
    new THREE.MeshStandardMaterial({
        color: 0x513a32,
        roughness: 1
    })
);

carpet.position.set(
    -1,
    0.02,
    1
);

scene.add(carpet);


// =====================================================
// КАМЕРА — ЕСТЕСТВЕННОЕ ДВИЖЕНИЕ
// =====================================================

let yaw = 0;

let pitch = 0;

let targetYaw = 0;

let targetPitch = 0;


// Плавность

const smoothness = 0.09;


// Ограничения взгляда

const maxPitch = 1.15;


// =====================================================
// TOUCH
// =====================================================

let touching = false;

let lastX = 0;

let lastY = 0;


// Для pinch

let pinchDistance = 0;

let targetFOV = 70;


// =====================================================
// TOUCH START
// =====================================================

renderer.domElement.addEventListener(
    "touchstart",
    (event) => {

        event.preventDefault();


        if (
            event.touches.length === 1
        ) {

            touching = true;

            lastX =
            event.touches[0].clientX;

            lastY =
            event.touches[0].clientY;
        }


        if (
            event.touches.length === 2
        ) {

            touching = false;

            pinchDistance =
            getDistance(
                event.touches[0],
                event.touches[1]
            );
        }

    },
    { passive: false }
);


// =====================================================
// TOUCH MOVE
// =====================================================

renderer.domElement.addEventListener(
    "touchmove",
    (event) => {

        event.preventDefault();


        // ОДИН ПАЛЕЦ

        if (
            event.touches.length === 1 &&
            touching
        ) {

            const x =
            event.touches[0].clientX;

            const y =
            event.touches[0].clientY;


            const dx =
            x - lastX;

            const dy =
            y - lastY;


            targetYaw -=
            dx * 0.004;


            targetPitch -=
            dy * 0.003;


            targetPitch =
            Math.max(
                -maxPitch,
                Math.min(
                    maxPitch,
                    targetPitch
                )
            );


            lastX = x;

            lastY = y;
        }


        // ДВА ПАЛЬЦА

        if (
            event.touches.length === 2
        ) {

            const distance =
            getDistance(
                event.touches[0],
                event.touches[1]
            );


            const difference =
            distance -
            pinchDistance;


            targetFOV -=
            difference * 0.03;


            targetFOV =
            Math.max(
                50,
                Math.min(
                    80,
                    targetFOV
                )
            );


            pinchDistance =
            distance;
        }

    },
    { passive: false }
);


// =====================================================
// TOUCH END
// =====================================================

renderer.domElement.addEventListener(
    "touchend",
    () => {

        touching = false;

    }
);


// =====================================================
// РАССТОЯНИЕ МЕЖДУ ПАЛЬЦАМИ
// =====================================================

function getDistance(a, b) {

    const dx =
    a.clientX -
    b.clientX;

    const dy =
    a.clientY -
    b.clientY;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );
}


// =====================================================
// ОБНОВЛЕНИЕ КАМЕРЫ
// =====================================================

let time = 0;


function updateCamera() {

    time += 0.01;


    // Плавность

    yaw +=
    (targetYaw - yaw) *
    smoothness;


    pitch +=
    (targetPitch - pitch) *
    smoothness;


    camera.fov +=
    (targetFOV -
    camera.fov) *
    0.08;

    camera.updateProjectionMatrix();


    // Небольшое естественное
    // движение головы

    const breathing =
    Math.sin(time) *
    0.008;


    const lookX =
    Math.sin(yaw) *
    Math.cos(pitch);


    const lookY =
    Math.sin(pitch);


    const lookZ =
    -Math.cos(yaw) *
    Math.cos(pitch);


    const lookDistance = 10;


    const target =
    new THREE.Vector3(
        camera.position.x +
        lookX * lookDistance,

        camera.position.y +
        lookY * lookDistance +
        breathing,

        camera.position.z +
        lookZ * lookDistance
    );


    camera.lookAt(target);
}


// =====================================================
// АНИМАЦИЯ
// =====================================================

function animate() {

    requestAnimationFrame(
        animate
    );


    updateCamera();


    renderer.render(
        scene,
        camera
    );
}


animate();


// =====================================================
// RESIZE
// =====================================================

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
        window.innerWidth /
        window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
