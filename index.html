<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Alicia AI</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #20252a;
    touch-action: none;
}

canvas {
    display: block;
}
</style>
</head>

<body>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


// =========================
// СЦЕНА
// =========================

const scene = new THREE.Scene();

scene.background =
new THREE.Color(0x20252a);


// =========================
// КАМЕРА
// =========================

const camera =
new THREE.PerspectiveCamera(
    70,
    window.innerWidth / window.innerHeight,
    0.1,
    100
);

camera.position.set(0, 2.2, 7);


// =========================
// РЕНДЕР
// =========================

const renderer =
new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

document.body.appendChild(
    renderer.domElement
);


// =========================
// СВЕТ
// =========================

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        1.5
    )
);

const light =
new THREE.PointLight(
    0xffd7a0,
    25,
    15
);

light.position.set(0, 3.5, 2);

scene.add(light);


// =========================
// МАТЕРИАЛЫ
// =========================

const wallMaterial =
new THREE.MeshStandardMaterial({
    color: 0x70452c
});

const floorMaterial =
new THREE.MeshStandardMaterial({
    color: 0x3d2920
});


// =========================
// ПОЛ
// =========================

const floor =
new THREE.Mesh(
    new THREE.BoxGeometry(
        10, 0.2, 10
    ),
    floorMaterial
);

floor.position.y = -0.1;

scene.add(floor);


// =========================
// СТЕНЫ
// =========================

const backWall =
new THREE.Mesh(
    new THREE.BoxGeometry(
        10, 5, 0.2
    ),
    wallMaterial
);

backWall.position.set(
    0, 2.5, -3
);

scene.add(backWall);


const leftWall =
new THREE.Mesh(
    new THREE.BoxGeometry(
        0.2, 5, 6
    ),
    wallMaterial
);

leftWall.position.set(
    -5, 2.5, 0
);

scene.add(leftWall);


const rightWall =
new THREE.Mesh(
    new THREE.BoxGeometry(
        0.2, 5, 6
    ),
    wallMaterial
);

rightWall.position.set(
    5, 2.5, 0
);

scene.add(rightWall);


// =========================
// СТОЛ
// =========================

const table =
new THREE.Mesh(
    new THREE.BoxGeometry(
        2.5, 0.2, 1.2
    ),
    wallMaterial
);

table.position.set(
    0, 1.4, -1
);

scene.add(table);


// =========================
// НОЖКИ
// =========================

for (const x of [-1, 1]) {

    for (const z of [-0.4, 0.4]) {

        const leg =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                0.15, 1.4, 0.15
            ),
            wallMaterial
        );

        leg.position.set(
            x,
            0.7,
            -1 + z
        );

        scene.add(leg);
    }
}


// =========================
// ОКНО
// =========================

const windowMesh =
new THREE.Mesh(
    new THREE.BoxGeometry(
        3, 2, 0.1
    ),
    new THREE.MeshBasicMaterial({
        color: 0x6fa8c9
    })
);

windowMesh.position.set(
    0, 2.8, -2.85
);

scene.add(windowMesh);


// =========================
// УПРАВЛЕНИЕ КАМЕРОЙ
// =========================

let rotationY = 0;
let rotationX = 0;

let startX = 0;
let startY = 0;

let dragging = false;


// НАЧАЛО КАСАНИЯ

renderer.domElement.addEventListener(
    "touchstart",
    function(event) {

        if (event.touches.length !== 1)
            return;

        dragging = true;

        startX =
        event.touches[0].clientX;

        startY =
        event.touches[0].clientY;
    }
);


// ДВИЖЕНИЕ ПАЛЬЦА

renderer.domElement.addEventListener(
    "touchmove",
    function(event) {

        if (!dragging)
            return;

        if (event.touches.length !== 1)
            return;

        const x =
        event.touches[0].clientX;

        const y =
        event.touches[0].clientY;

        const dx =
        x - startX;

        const dy =
        y - startY;

        rotationY += dx * 0.005;

        rotationX += dy * 0.005;

        rotationX =
        Math.max(
            -1.2,
            Math.min(1.2, rotationX)
        );

        startX = x;
        startY = y;
    }
);


// ОКОНЧАНИЕ

renderer.domElement.addEventListener(
    "touchend",
    function() {

        dragging = false;
    }
);


// =========================
// КАМЕРА
// =========================

function updateCamera() {

    const radius = 7;

    camera.position.x =
    Math.sin(rotationY) *
    Math.cos(rotationX) *
    radius;

    camera.position.y =
    2.2 +
    Math.sin(rotationX) *
    radius;

    camera.position.z =
    Math.cos(rotationY) *
    Math.cos(rotationX) *
    radius;

    camera.lookAt(
        0,
        1.5,
        0
    );
}


// =========================
// ЦИКЛ
// =========================

function animate() {

    requestAnimationFrame(
        animate
    );

    updateCamera();

    renderer.render(
        scene,
        camera
    );
}

animate();


// =========================
// RESIZE
// =========================

window.addEventListener(
    "resize",
    function() {

        camera.aspect =
        window.innerWidth /
        window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
