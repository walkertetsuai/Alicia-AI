<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alicia AI — Room</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


// СЦЕНА
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x20252a);


// КАМЕРА
const camera = new THREE.PerspectiveCamera(
  70,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);

camera.position.set(0, 2.2, 7);
camera.lookAt(0, 1.5, 0);


// РЕНДЕР
const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

document.body.appendChild(renderer.domElement);


// СВЕТ
const ambientLight = new THREE.AmbientLight(
  0xffffff,
  1.5
);

scene.add(ambientLight);


const lamp = new THREE.PointLight(
  0xffddaa,
  25,
  15
);

lamp.position.set(0, 3.5, 2);
scene.add(lamp);


// МАТЕРИАЛЫ
const wood = new THREE.MeshStandardMaterial({
  color: 0x70452c
});

const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0x3d2920
});


// ПОЛ
const floor = new THREE.Mesh(
  new THREE.BoxGeometry(10, 0.2, 10),
  floorMaterial
);

floor.position.y = -0.1;

scene.add(floor);


// ЗАДНЯЯ СТЕНА
const backWall = new THREE.Mesh(
  new THREE.BoxGeometry(10, 5, 0.2),
  wood
);

backWall.position.set(0, 2.5, -3);

scene.add(backWall);


// ЛЕВАЯ СТЕНА
const leftWall = new THREE.Mesh(
  new THREE.BoxGeometry(0.2, 5, 6),
  wood
);

leftWall.position.set(-5, 2.5, 0);

scene.add(leftWall);


// ПРАВАЯ СТЕНА
const rightWall = new THREE.Mesh(
  new THREE.BoxGeometry(0.2, 5, 6),
  wood
);

rightWall.position.set(5, 2.5, 0);

scene.add(rightWall);


// СТОЛ
const table = new THREE.Mesh(
  new THREE.BoxGeometry(2.5, 0.2, 1.2),
  wood
);

table.position.set(0, 1.4, -1);

scene.add(table);


// НОЖКИ СТОЛА
for (const x of [-1, 1]) {
  for (const z of [-0.4, 0.4]) {

    const leg = new THREE.Mesh(
      new THREE.BoxGeometry(0.15, 1.4, 0.15),
      wood
    );

    leg.position.set(x, 0.7, -1 + z);

    scene.add(leg);
  }
}


// ОКНО
const windowMaterial = new THREE.MeshBasicMaterial({
  color: 0x6fa8c9
});

const windowMesh = new THREE.Mesh(
  new THREE.BoxGeometry(3, 2, 0.1),
  windowMaterial
);

windowMesh.position.set(0, 2.8, -2.85);

scene.add(windowMesh);


// АНИМАЦИЯ
function animate() {

  requestAnimationFrame(animate);

  renderer.render(scene, camera);
}

animate();


// АДАПТАЦИЯ ПОД ЭКРАН
window.addEventListener("resize", () => {

  camera.aspect =
    window.innerWidth / window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

});

</script>

</body>
</html>
